<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Géographie des correspondances</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
html,body{height:100%;margin:0;background:#f5f1e8;color:#29261f;font-family:Georgia,serif}#app{height:100%;min-height:650px;display:grid;grid-template-rows:auto 1fr}header{padding:18px 24px 14px;border-bottom:1px solid #d8d0bf}h1{font-size:24px;margin:0 0 4px}.sub{color:#70695d}.stats{margin-top:8px;font:12px system-ui;color:#81796b}#map{height:100%;min-height:560px}.leaflet-tile{filter:saturate(.55) sepia(.12) brightness(1.04)}.node{background:#332e27;border:2px solid #f5f1e8;border-radius:50%;box-shadow:0 0 0 1px #332e27}.place-label{background:rgba(245,241,232,.9);border:0;box-shadow:none;color:#332e27;font:12px Georgia;padding:2px 5px}.panel{position:absolute;right:18px;top:105px;z-index:800;width:min(330px,calc(100% - 60px));max-height:70%;overflow:auto;background:rgba(250,247,239,.97);border:1px solid #cfc5b1;box-shadow:0 8px 28px #0003;padding:17px;display:none}.panel h2{font-size:17px;margin:0 24px 5px 0}.meta,.letter div{font:12px system-ui;color:#746c5e}.letter{padding:9px 0;border-top:1px solid #ddd4c3}.letter b{font-size:13px}.close{position:absolute;right:10px;top:8px;border:0;background:none;font-size:20px;cursor:pointer}.legend{background:#faf7efee;padding:8px 10px;border:1px solid #d4cbb9;font:11px system-ui;line-height:1.5}@media(max-width:700px){.place-label{display:none}}
</style></head><body><div id="app"><header><h1>Géographie des correspondances</h1><div class="sub">Circulation des lettres entre l’Ubaye et le monde</div><div class="stats"><span id="rc"></span> itinéraires · 14 lettres avec trajet complet · 1883–1921</div></header><div id="map"></div></div><div class="panel" id="panel"><button class="close" onclick="panel.style.display='none'">×</button><div id="body"></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const letters=[{"id": 27, "title": "Lettre n°1 - Fonds Famille Amable Mathieu", "date": "25 Aug 1897", "from": {"name": "Durango, Mexico", "lon": -104.833333, "lat": 24.833333}, "to": {"name": "Guadalajara, Mexico", "lon": -103.338396, "lat": 20.6720375}}, {"id": 33, "title": "Lettre n°1 - Fonds Famille Auguste Reynier", "date": "11 Oct 1888", "from": {"name": "Mexico City, Mexico", "lon": -99.1276646, "lat": 19.4284724}, "to": {"name": "Saint-Étienne-les-Orgues, France", "lon": 5.7785724, "lat": 44.0454402}}, {"id": 31, "title": "Lettre n°1 - Fonds Famille Caire", "date": "13 Jun 1911", "from": {"name": "Barcelonnette, France", "lon": 6.6513554, "lat": 44.3862043}, "to": {"name": "Guadalajara, Mexico", "lon": -103.338396, "lat": 20.6720375}}, {"id": 6, "title": "Lettre n°1 - Fonds Famille Lions", "date": "8 Jan 1887", "from": {"name": "Paris, France", "lon": 2.320041, "lat": 48.8588897}, "to": {"name": "Barcelonnette, France", "lon": 6.6513554, "lat": 44.3862043}}, {"id": 28, "title": "Lettre n°1 - Fonds Minouche Suberville", "date": "28 Feb 1921", "from": {"name": "Mexico City, Mexico", "lon": -99.1276646, "lat": 19.4284724}, "to": {"name": "Mexico City, Mexico", "lon": -99.1276646, "lat": 19.4284724}}, {"id": 25, "title": "Lettre n°2 - Fonds Famille Amable Mathieu", "date": "1 Jul 1910", "from": {"name": "Namiquipa, Mexico", "lon": -107.4150652, "lat": 29.2506876}, "to": {"name": "Durango, Mexico", "lon": -104.833333, "lat": 24.833333}}, {"id": 34, "title": "Lettre n°2 - Fonds Famille Auguste Reynier", "date": "28 Oct 1888", "from": {"name": "Tulancingo, Mexico", "lon": -97.4421045, "lat": 17.7523142}, "to": {"name": "Saint-Étienne-les-Orgues, France", "lon": 5.7785724, "lat": 44.0454402}}, {"id": 8, "title": "Lettre n°2 - Fonds Famille Lions", "date": "17 Jul 1888", "from": {"name": "Puebla, Mexico", "lon": -98, "lat": 18.833333}, "to": {"name": "Barcelonnette, France", "lon": 6.6513554, "lat": 44.3862043}}, {"id": 26, "title": "Lettre n°3 - Fonds Famille Amable Mathieu", "date": "12 Aug 1910", "from": {"name": "Namiquipa, Mexico", "lon": -107.4150652, "lat": 29.2506876}, "to": {"name": "Durango, Mexico", "lon": -104.833333, "lat": 24.833333}}, {"id": 35, "title": "Lettre n°3 - Fonds Famille Auguste Reynier", "date": "8 Nov 1889", "from": {"name": "Tulancingo, Mexico", "lon": -97.4421045, "lat": 17.7523142}, "to": {"name": "Saint-Étienne-les-Orgues, France", "lon": 5.7785724, "lat": 44.0454402}}, {"id": 18, "title": "Lettre n°3 - Fonds Famille Lions", "date": "1 Aug 1888", "from": {"name": "Mexico City, Mexico", "lon": -99.1276646, "lat": 19.4284724}, "to": {"name": "Barcelonnette, France", "lon": 6.6513554, "lat": 44.3862043}}, {"id": 36, "title": "Lettre n°4 - Fonds Famille Auguste Reynier", "date": "11 Feb 1893", "from": {"name": "Mexico City, Mexico", "lon": -99.1276646, "lat": 19.4284724}, "to": {"name": "Saint-Étienne-les-Orgues, France", "lon": 5.7785724, "lat": 44.0454402}}, {"id": 9, "title": "Lettre n°4 - Fonds Famille Lions", "date": "11 Dec 1895", "from": {"name": "Manchester, UK", "lon": -2.2324547, "lat": 53.4424618}, "to": {"name": "Barcelonnette, France", "lon": 6.6513554, "lat": 44.3862043}}, {"id": 10, "title": "Lettre n°5 - Fonds Famille Lions", "date": "28 Dec 1883", "from": {"name": "Barcelonnette, France", "lon": 6.6513554, "lat": 44.3862043}, "to": {"name": "Mexico City, Mexico", "lon": -99.1276646, "lat": 19.4284724}}];
const map=L.map('map',{worldCopyJump:true}).setView([33,-45],3);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const routes=new Map(),places=new Map();for(const l of letters){let k=l.from.name+'|'+l.to.name;if(!routes.has(k))routes.set(k,{from:l.from,to:l.to,letters:[]});routes.get(k).letters.push(l);places.set(l.from.name,l.from);places.set(l.to.name,l.to)}rc.textContent=routes.size;
function curve(a,b){let dx=b.lon-a.lon,dy=b.lat-a.lat,cx=(a.lon+b.lon)/2-dy*.18,cy=(a.lat+b.lat)/2+dx*.18,p=[];for(let i=0;i<=50;i++){let t=i/50,u=1-t;p.push([u*u*a.lat+2*u*t*cy+t*t*b.lat,u*u*a.lon+2*u*t*cx+t*t*b.lon])}return p}
function loop(p){return [[p.lat,p.lon],[p.lat+4,p.lon-4],[p.lat+5,p.lon+4],[p.lat,p.lon]]}
let bounds=[];for(const r of routes.values()){let pts=r.from.name===r.to.name?loop(r.from):curve(r.from,r.to),w=1.6+Math.min(4,r.letters.length*1.15);let line=L.polyline(pts,{color:'#7b3f2b',weight:w,opacity:.72}).addTo(map);line.bindTooltip(`<b>${r.from.name} → ${r.to.name}</b><br>${r.letters.length} lettre${r.letters.length>1?'s':''}`);line.on('click',()=>show(r));bounds.push(...pts);let i=Math.floor(pts.length*.72),a=map.latLngToLayerPoint(pts[i-1]),b=map.latLngToLayerPoint(pts[i]),ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;L.marker(pts[i],{interactive:false,icon:L.divIcon({className:'',html:`<div style="transform:rotate(${ang}deg);font-size:${12+w}px;color:#7b3f2b">➤</div>`,iconSize:[20,20],iconAnchor:[10,10]})}).addTo(map)}
for(const p of places.values())L.marker([p.lat,p.lon],{icon:L.divIcon({className:'node',iconSize:[10,10],iconAnchor:[5,5]})}).addTo(map).bindTooltip(p.name,{permanent:true,direction:'top',offset:[0,-7],className:'place-label'});map.fitBounds(bounds,{padding:[35,35]});
function show(r){body.innerHTML=`<h2>${r.from.name} → ${r.to.name}</h2><div class="meta">${r.letters.length} lettre${r.letters.length>1?'s':''}</div>`+r.letters.map(l=>`<div class="letter"><b>${l.title}</b><div>${l.date}</div></div>`).join('');panel.style.display='block'}
let lg=L.control({position:'bottomleft'});lg.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<b>Lecture</b><br>● lieu &nbsp; ➤ direction<br>Épaisseur = nombre de lettres';return d};lg.addTo(map);
